<style>
/* ============================================================

:root {

  --blanco:#FFFFFF;--oro:#F0D68A;--oro-claro:#F0D68A;--verde:#9BDEC7;

}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'DM Sans',sans-serif;background-color:var(--bg);background-image:linear-gradient(160deg,#1A3A5C 0%,#0D2240 100%);background-attachment:fixed;color:var(--azul-pale);min-height:100vh;overflow-x:hidden;position:relative;
  font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
em,i,cite{font-style:normal;font-weight:700;color:var(--azul);}
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse 60% 50% at 10% 15%,rgba(240,214,138,0.10) 0%,transparent 65%),
  radial-gradient(ellipse 50% 60% at 90% 85%,rgba(212,168,67,0.16) 0%,transparent 65%),
  radial-gradient(ellipse 40% 40% at 50% 50%,rgba(255,255,255,0.04) 0%,transparent 70%);
  pointer-events:none;z-index:0;}
body::after{content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events:none;z-index:0;opacity:0.18;}
.particulas{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.particula{position:absolute;border-radius:50%;opacity:0;animation:flotar linear infinite;}
@keyframes flotar{
  0%{opacity:0;transform:translateY(0) scale(0.8);}
  8%{opacity:var(--op,0.5);}
  92%{opacity:var(--op,0.5);}
  100%{opacity:0;transform:translateY(-90vh) scale(1.1);}
}
.app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:2rem 1.2rem 3rem;}
.header{display:flex;flex-direction:column;align-items:center;margin-bottom:1.6rem;animation:fadeDown .65s ease both;}
.marca{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;letter-spacing:3.5px;text-transform:uppercase;color:var(--oro-claro);margin-bottom:14px;opacity:0.85;}
.logo-wrap{position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;animation:logoNace 1.4s ease both;}
@keyframes logoNace{
  0%{opacity:0;transform:scale(0.6);filter:blur(6px);}
  55%{opacity:1;filter:blur(0);}
  100%{opacity:1;transform:scale(1);}
}
.anillo-svg{position:absolute;inset:0;width:120px;height:120px;transform:rotate(-90deg);}
.anillo-track{fill:none;stroke:rgba(240,214,138,0.28);stroke-width:2;}
.anillo-progreso{fill:none;stroke:url(#gradAnillo);stroke-width:2;stroke-linecap:round;
  stroke-dasharray:345;stroke-dashoffset:345;animation:activar 2.4s ease-out .3s forwards;}
@keyframes activar{to{stroke-dashoffset:0;}}
.logo-img{height:76px;width:auto;object-fit:contain;filter:drop-shadow(0 0 20px rgba(212,168,67,.3));
  animation:respirar 5s ease-in-out infinite;animation-delay:2.6s;}
@keyframes respirar{
  0%,100%{filter:drop-shadow(0 0 20px rgba(212,168,67,.3));}
  50%{filter:drop-shadow(0 0 34px rgba(212,168,67,.55));}
}
.brujula-wrap{position:absolute;bottom:-4px;right:-4px;width:30px;height:30px;}
.brujula-svg{width:100%;height:100%;animation:orientar 3.2s cubic-bezier(.22,1,.36,1) .5s both;transform-origin:50% 50%;}
@keyframes orientar{
  0%{transform:rotate(0deg);opacity:0;}
  15%{opacity:1;}
  70%{transform:rotate(620deg);}
  100%{transform:rotate(360deg);opacity:1;}
}
.wa-pill{display:inline-flex;align-items:center;gap:6px;font-size:20px;font-weight:500;background:rgba(155,222,199,.12);border:1px solid rgba(155,222,199,.38);color:#CBD9EE;padding:4px 14px;border-radius:30px;margin-top:12px;}
.wa-pill a{color:#9BDEC7;font-weight:700;text-decoration:none;}
.wa-pill a .wa-label{color:#CBD9EE;font-weight:500;}
.narrativa{height:22px;display:flex;align-items:center;justify-content:center;margin:1.1rem 0 .2rem;position:relative;}
.narrativa span{position:absolute;font-family:'Playfair Display',serif;font-size:20px;color:var(--oro-claro);opacity:0;letter-spacing:.3px;
  animation-name:fraseCiclo;animation-timing-function:ease;animation-iteration-count:infinite;}
@keyframes fraseCiclo{
  0%{opacity:0;transform:translateY(6px);}
  4%{opacity:1;transform:translateY(0);}
  14%{opacity:1;}
  19%{opacity:0;transform:translateY(-6px);}
  100%{opacity:0;}
}
.titulo-wrap{text-align:center;margin-bottom:1.8rem;animation:fadeDown .65s ease .1s both;}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:3.5px;text-transform:uppercase;color:var(--azul);margin-bottom:10px;}
.contexto-2027{font-size:17px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--oro-claro);

.titulo-wrap h1{font-family:'Playfair Display',serif;font-size:clamp(1.9rem,5.4vw,2.7rem);font-weight:900;line-height:1.1;color:var(--blanco);}
.titulo-wrap h1 .destacado{color:var(--azul);font-weight:900;}

.sep{display:flex;align-items:center;gap:10px;margin:1.6rem 0;animation:fadeIn .8s ease .2s both;}
.sep-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(212,168,67,0.7),transparent);}
.sep-icon{font-size:17px;color:var(--oro);opacity:1;}
.card{background:var(--card-bg);border:1px solid var(--borde);border-radius:16px;padding:1.7rem 1.5rem;margin-bottom:1.2rem;box-shadow:0 6px 22px rgba(8,37,103,0.10);animation:fadeUp .7s ease both;}
.card-tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--oro-claro);background:rgba(212,168,67,0.16);border:1px solid rgba(212,168,67,0.45);padding:3px 10px;border-radius:20px;margin-bottom:14px;}
.card h2{font-family:'Playfair Display',serif;font-size:1.45rem;font-weight:700;color:var(--blanco);line-height:1.3;margin-bottom:14px;}
.card h2 .destacado{color:var(--azul);font-weight:700;}
.card p{font-size:20px;line-height:1.75;color:#CBD9EE;margin-bottom:10px;}
.card p:last-of-type{margin-bottom:0;}
.card p strong{color:var(--blanco);font-weight:600;}
.pilares{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:1rem 0 0.5rem;}
.pilar{background:#2E5680;border:1px solid var(--borde);border-radius:10px;padding:10px 12px;display:flex;align-items:flex-start;gap:8px;}
.pilar-ico{font-size:20px;line-height:1;margin-top:1px;}
.pilar-txt{font-size:20px;color:var(--azul-pale);line-height:1.45;}
.pilar-txt strong{display:block;color:var(--blanco);font-size:17px;margin-bottom:1px;}
.quote{border-left:2.5px solid var(--oro-claro);padding:10px 14px;margin:1.2rem 0;background:rgba(212,168,67,0.14);border-radius:0 8px 8px 0;}
.quote p{font-family:'Playfair Display',serif;font-size:20px;color:var(--oro-claro);line-height:1.6;margin:0;}
.novedad{background:rgba(155,222,199,0.12);border:1px solid rgba(155,222,199,0.38);border-radius:12px;padding:12px 14px;margin:1rem 0;display:flex;align-items:flex-start;gap:10px;}
.novedad-ico{font-size:20px;line-height:1;margin-top:1px;flex-shrink:0;}
.novedad-txt{font-size:17px;color:#CBD9EE;line-height:1.6;}
.novedad-txt strong{color:#9BDEC7;font-weight:600;}
.cta-wrap{text-align:center;margin-top:1.8rem;animation:fadeUp .7s ease .3s both;}
.btn-cta{position:relative;display:inline-flex;align-items:center;gap:10px;

.btn-cta svg{width:20px;height:20px;stroke:#0D2240;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:1;}
.btn-cta span{position:relative;z-index:1;}
.cta-nota{font-size:20px;color:var(--muted);margin-top:10px;letter-spacing:0.3px;}
@keyframes pulse-glow-azul{
  0%,100%{box-shadow:0 6px 20px rgba(8,37,103,0.22);}

}
.footer{text-align:center;margin-top:2.5rem;animation:fadeIn 1s ease .5s both;}

.footer a{color:#F0D68A;text-decoration:none;}
@keyframes fadeDown{from{opacity:0;transform:translateY(-18px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
</style>
</head>
<body>

<script>
/* ============================================================
   CONFIG_ALPHA — ÚNICO BLOQUE QUE CAMBIA ENTRE HERRAMIENTAS
   ============================================================ */
const CONFIG_ALPHA = {
  metaTitulo: "Sistema Operativo Vivo ALPHA · Portal",
  destinoURL: "https://script.google.com/macros/s/AKfycbyUGhCW8JkcvC8-uN1cA4FsiNw-EViVImDGyFoY9DKSaN3uxMqtLSRLRee9LGBGt_ac/exec",  // ← nombre del archivo de la experiencia
  textoBoton: "Entrar a la experiencia",
  ctaNota: "⏱ Experiencia guiada · 9 minutos · cinco órganos · cinco momentos",
  numeroParticulas: 20,
  narrativa: [
    "Un territorio puede enfermar.",
    "También puede reconocer sus heridas.",
    "Puede volver a sentir.",
    "Puede encontrar un propósito compartido.",
    "Puede organizarse.",
    "Y construir lo que perdura y trasciende."
  ],
  eyebrow: "Sistema ALPHA · «La Jugada Maestra»",
  contexto: "PROYECTO TERRITORIAL · 2027 ALPHA",
  tituloHTML: "Sistema Operativo<br><strong class='destacado'>Vivo ALPHA</strong>",
  subtitulo: "«Un territorio despierta cuando se reconoce, encuentra su propósito, vuelve a sentir, se organiza y construye lo que perdura y trasciende.»",
  cardQueEs: {
    tag: "⬡ Insumo fundamental",
    h2HTML: "Leer el territorio es recorrer un <strong class='destacado'>cuerpo vivo</strong>",
    parrafos: [
      "Una experiencia pedagógica que atraviesa <strong>cinco órganos en cuidados intensivos</strong>: el Corazón, la Cabeza, el Sistema Nervioso, la Sangre y el Esqueleto.",
      "Cada órgano enfermo se sana recorriendo exactamente los mismos <strong>5 momentos</strong>: la herida, la excavación, el reconocimiento, el despertar y la acción ALPHA."
    ],
    quote: "«La política debe ser herramienta para transformar la vida de la gente, nunca una herramienta para transar con ella.»",
    pilares: [
      {icono:"❤️", titulo:"Identidad", texto:"Corazón · latido que moviliza"},
      {icono:"🧠", titulo:"Propósito", texto:"Cabeza · rumbo compartido"},
      {icono:"⚡", titulo:"Sentir", texto:"Nervioso · indignación constructiva"},
      {icono:"🩸", titulo:"Organización", texto:"Sangre · tejido vivo"},
      {icono:"🦴", titulo:"Estructura", texto:"Esqueleto · lo que dura"}
    ]
  },
  cardComoFunciona: {
    tag: "⬡ ¿Cómo funciona?",
    h2HTML: "Cinco órganos · <strong class='destacado'>cinco momentos</strong>",
    parrafos: [
      "La herida, la excavación, el reconocimiento, el despertar y la acción ALPHA construyen una <strong>secuencia de sanación</strong> que atraviesa cada uno de los cinco órganos del territorio.",
      "Cada órgano se expande para revelar sus 5 momentos: un viaje que va desde <strong>reconocer el daño</strong> hasta <strong>construir lo que perdura</strong>."
    ],
    novedad: {
      icono: "🎯",
      html: "<strong>Nuevo:</strong> El «Cuerpo de Esperanzía» — un sistema vivo, orgánico y comprobado en cientos de territorios de Colombia."
    }
  }
};

/* ============================================================
   MOTOR DE RENDERIZADO
   ============================================================ */
(function render(){
  document.getElementById('metaTitulo').textContent = CONFIG_ALPHA.metaTitulo;
  document.getElementById('txtEyebrow').textContent = CONFIG_ALPHA.eyebrow;
  document.getElementById('txtContexto').textContent = CONFIG_ALPHA.contexto;
  document.getElementById('txtTitulo').innerHTML = CONFIG_ALPHA.tituloHTML;
  document.getElementById('txtSubtitulo').innerHTML = CONFIG_ALPHA.subtitulo;

  const capaNarrativa = document.getElementById('capaNarrativa');
  const nFrases = CONFIG_ALPHA.narrativa.length;
  const intervalo = 3.5;
  const cicloTotal = nFrases * intervalo;
  CONFIG_ALPHA.narrativa.forEach((frase, i) => {
    const span = document.createElement('span');
    span.textContent = frase;
    span.style.animationDuration = cicloTotal + 's';
    span.style.animationDelay = (i * intervalo) + 's';
    capaNarrativa.appendChild(span);
  });

  document.getElementById('c1Tag').textContent = CONFIG_ALPHA.cardQueEs.tag;
  document.getElementById('c1H2').innerHTML = CONFIG_ALPHA.cardQueEs.h2HTML;
  const c1Parrafos = document.getElementById('c1Parrafos');
  CONFIG_ALPHA.cardQueEs.parrafos.forEach(txt => {
    const p = document.createElement('p');
    p.innerHTML = txt;
    c1Parrafos.appendChild(p);
  });
  const c1Quote = document.getElementById('c1Quote');
  if(CONFIG_ALPHA.cardQueEs.quote){
    c1Quote.innerHTML = `<div class="quote"><p>${CONFIG_ALPHA.cardQueEs.quote}</p></div>`;
  }
  const c1Pilares = document.getElementById('c1Pilares');
  (CONFIG_ALPHA.cardQueEs.pilares || []).forEach(p => {
    c1Pilares.innerHTML += `
      <div class="pilar">
        <div class="pilar-ico">${p.icono}</div>
        <div class="pilar-txt"><strong>${p.titulo}</strong>${p.texto}</div>
      </div>`;
  });

  document.getElementById('c2Tag').textContent = CONFIG_ALPHA.cardComoFunciona.tag;
  document.getElementById('c2H2').innerHTML = CONFIG_ALPHA.cardComoFunciona.h2HTML;
  const c2Parrafos = document.getElementById('c2Parrafos');
  CONFIG_ALPHA.cardComoFunciona.parrafos.forEach(txt => {
    const p = document.createElement('p');
    p.innerHTML = txt;
    c2Parrafos.appendChild(p);
  });
  const c2Novedad = document.getElementById('c2Novedad');
  if(CONFIG_ALPHA.cardComoFunciona.novedad){
    const nov = CONFIG_ALPHA.cardComoFunciona.novedad;
    c2Novedad.innerHTML = `
      <div class="novedad">
        <div class="novedad-ico">${nov.icono}</div>
        <div class="novedad-txt">${nov.html}</div>
      </div>`;
  }

  document.getElementById('btnEntrar').setAttribute('href', CONFIG_ALPHA.destinoURL);
  document.getElementById('txtBoton').textContent = CONFIG_ALPHA.textoBoton;
  document.getElementById('txtCtaNota').textContent = CONFIG_ALPHA.ctaNota;

  const capa = document.getElementById('capaParticulas');
  const colores = ['#D4A843','#F0D68A','#BAD5ED'];
  for(let i=0; i<CONFIG_ALPHA.numeroParticulas; i++){
    const p = document.createElement('div');
    p.className = 'particula';
    const tam = (Math.random()*3 + 1.5).toFixed(1);
    const color = colores[i % colores.length];
    const izquierda = Math.random()*100;
    const duracion = (Math.random()*14 + 14).toFixed(1);
    const retraso = (Math.random()*18).toFixed(1);
    const opacidad = (Math.random()*0.35 + 0.15).toFixed(2);
    p.style.width = tam + 'px';
    p.style.height = tam + 'px';
    p.style.left = izquierda + '%';
    p.style.bottom = '-10px';
    p.style.background = color;
    p.style.setProperty('--op', opacidad);
    p.style.animationDuration = duracion + 's';
    p.style.animationDelay = retraso + 's';
    capa.appendChild(p);
  }
})();
</script>
